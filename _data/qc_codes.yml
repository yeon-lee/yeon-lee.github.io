# Codes in the "same distance, fewer qubits" figure at the top of
# /quantum-computing/ (_includes/qc/budget.liquid). One button per block, in
# display order. n = data qubits, k = logical qubits, d = code distance,
# w = check weight. The surface-code side of the figure is computed, not
# stored: k separate patches of d x d data qubits.
