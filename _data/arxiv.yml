# ---------------------------------------------------------------------------
# Settings for bin/update_arxiv.py, which regenerates _bibliography/papers.bib
# from the arXiv API (run automatically by .github/workflows/update-arxiv.yml).
#
# After editing this file, either wait for the nightly run or trigger it from
# GitHub: Actions -> "Update publications from arXiv" -> Run workflow.
# ---------------------------------------------------------------------------

# arXiv search query. `au:"..."` is an exact author-name match.
# See https://info.arxiv.org/help/api/user-manual.html#query_details
author_query: 'au:"Jong Yeon Lee"'

# Safety net: keep a paper only if one of its authors is spelled like this
# (hyphens, dots and case are ignored). Leave empty to trust the query alone.
author_names:
  - Jong Yeon Lee
  - Jong-Yeon Lee

# Name as the arxiv.org author search wants it ("Last, First"). Used by the
# fallback path (search page + OAI-PMH) when the query API is blocked, which is
# the case on GitHub Actions runners. Defaults to author_names[0] rearranged.
author_search: "Lee, Jong Yeon"

# Keep only papers whose PRIMARY category starts with one of these.
# Leave empty to keep everything the query returns.
categories:
  - quant-ph
  - cond-mat
  - physics
  - hep-th
  - math-ph

# arXiv IDs (without version) to hide from the site, e.g. a false positive.
exclude: []

# arXiv IDs to always include even if the query or filters miss them.
include: []

# Show the Dimensions citation badge for papers that have a DOI (off: the counts were unreliable).
dimensions_badge: false

# Put the arXiv abstract into each entry (al-folio shows an "Abs" button).
include_abstract: true

# Which year to file a paper under: "journal" (publication year, falls back to
# the arXiv year for preprints) or "arxiv" (year of the first arXiv version).
year_source: journal

# Upper bound on how many results to page through.
max_results: 1000

# ---------------------------------------------------------------------------
# News items (_news/): one line per new preprint, plus one when a paper gets
# its journal reference. The highlight sentence is written by Claude when the
# ANTHROPIC_API_KEY repository secret is set (Settings -> Secrets -> Actions);
# otherwise the first sentence of the abstract is used. Delete a generated
# news file to drop that item; the script never re-creates one it already wrote.
# ---------------------------------------------------------------------------
news:
  enabled: true
  since: "2025-09-28"          # do not announce preprints submitted before this date
  announce_published: true     # also post "Published in <journal>: ..." items
  model: claude-sonnet-5-5     # Anthropic model for the highlight sentence
  max_words: 30
  # Group members as their names appear on arXiv (the PI is taken from author_names).
  # Papers with these co-authors are announced as "New preprint with <names>".
  members:
    - Jintae Kim
    - Akash Vijay
    - Rishi Lohar
    - Tai-Hsuan Yang
    - Yuta Hirasaki
    - Drew Kim
    - Andrew D. Kim
    - Bowen Shi
    - Olumakinde Ogunnaike

# ---------------------------------------------------------------------------
# Thumbnails: Figure 1 of each paper, taken from its arXiv HTML version, saved
# to assets/img/publication_preview/<arXiv id>.png (SVG figures are rasterised
# when cairosvg is installed). Papers without an HTML version (roughly before
# 2024) get none; drop your own <arXiv id>.png into that folder instead.
# To replace a thumbnail, overwrite the file; to remove one, delete it and add
# `preview: false` to the paper's overrides below.
# ---------------------------------------------------------------------------
previews:
  enabled: true
  max_per_run: 12              # be gentle with arXiv: at most this many downloads per run
  max_bytes: 600000            # skip figures larger than this
  png_width: 900

# ---------------------------------------------------------------------------
# Per-paper overrides, keyed by arXiv ID (quote the ID so YAML keeps it a string).
# Any BibTeX field al-folio understands can go here, for example:
#   selected: true          -> shown on the home page ("selected publications")
#   preview: myfig.png      -> thumbnail in assets/img/publication_preview/
#                              (a file named <arxiv-id>.png there is picked up automatically)
#   abbr: PRL               -> badge text (auto-derived from the journal otherwise)
#   award: Editors' Suggestion   award_name: PRL Editors' Suggestion
#   slides: talk.pdf  poster: poster.pdf  video: https://...  code: https://...
#   pdf: paper.pdf          -> file in assets/pdf/ (default is the arXiv PDF link)
#   journal: ...            -> fix a journal reference arXiv got wrong
# Setting a field to `false` or `null` removes it.
# ---------------------------------------------------------------------------
overrides:
  # --- journal references that arXiv does not know about (from the CV) ---
  "2304.13028":
    abbr: PRL
    journal: Phys. Rev. Lett.
    volume: "131"
    pages: "220403"
    year: "2023"
    doi: 10.1103/PhysRevLett.131.220403
    html: https://doi.org/10.1103/PhysRevLett.131.220403
  "2105.12112":
    abbr: PRX
    journal: Phys. Rev. X
    volume: "12"
    pages: "011061"
    year: "2022"
    doi: 10.1103/PhysRevX.12.011061
    html: https://doi.org/10.1103/PhysRevX.12.011061
  "2506.04221":
    abbr: PRX
    journal: Phys. Rev. X (accepted)
  "1812.10490":
    award: Editors' Suggestion
    award_name: PRB Editors' Suggestion
  # --- selected papers (shown on the home page) ---
  "2609.30069":
    selected: true
  "2607.05386":
    selected: true
  "2402.16937":
    selected: true
  "2301.05238":
    selected: true
  "2310.16881":
    selected: true
  "1903.08130":
    selected: true
