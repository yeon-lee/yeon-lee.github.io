name: Diagnose arXiv access
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe arXiv endpoints with several header profiles
        run: |
          Q='search_query=au:%22Jong+Yeon+Lee%22&max_results=1'
          probe() { # label, url, extra curl args...
            local label="$1"; local url="$2"; shift 2
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 "$@" "$url" 2>/dev/null || echo ERR)
            kind=$(head -c 200 /tmp/body | tr -d '\n' | cut -c1-60)
            echo "$code | $label | ${kind}"
          }
          echo "code | variant | body-start"
          probe "export default-curl"              "https://export.arxiv.org/api/query?$Q"
          probe "export browser-UA"                "https://export.arxiv.org/api/query?$Q" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          probe "export contact-UA+atom"           "https://export.arxiv.org/api/query?$Q" -A "yeon-lee.github.io-arxiv-sync/1.0 (mailto:jongyeon@illinois.edu)" -H "Accept: application/atom+xml, */*;q=0.8"
          probe "export python-urllib-UA"          "https://export.arxiv.org/api/query?$Q" -A "Python-urllib/3.12"
          probe "export contact-UA no-accept"      "https://export.arxiv.org/api/query?$Q" -A "arxiv-sync (mailto:jongyeon@illinois.edu)" -H "Accept:"
          probe "export http (not https)"          "http://export.arxiv.org/api/query?$Q"
          probe "arxiv.org default-curl"           "https://arxiv.org/api/query?$Q"
          probe "arxiv.org browser-UA"             "https://arxiv.org/api/query?$Q" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          probe "rss.arxiv.org atom quant-ph"      "https://rss.arxiv.org/atom/quant-ph"
          probe "oaipmh Identify"                  "https://oaipmh.arxiv.org/oai?verb=Identify"
          probe "arxiv.org abs page"               "https://arxiv.org/abs/2609.30069"
          probe "arxiv.org abs page browser-UA"    "https://arxiv.org/abs/2609.30069" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          probe "arxiv.org listing search page"    "https://arxiv.org/search/?searchtype=author&query=Lee%2C+Jong+Yeon"
          probe "export.arxiv.org search page"     "https://export.arxiv.org/search/?searchtype=author&query=Lee%2C+Jong+Yeon"
          probe "export abs page"                  "https://export.arxiv.org/abs/2609.30069"
          probe "export api HEAD-like (Accept xml)" "https://export.arxiv.org/api/query?$Q" -H "Accept: application/xml"
          echo "--- runner egress IP ---"; curl -sS --max-time 10 https://api.ipify.org || true; echo
