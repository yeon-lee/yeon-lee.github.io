name: Update publications from arXiv

# Regenerates _bibliography/papers.bib from the arXiv API (settings live in
# _data/arxiv.yml), writes a news item for each new preprint (_news/) and a
# Figure-1 thumbnail for each paper (assets/img/publication_preview/), commits
# whatever changed, and then kicks off the "Deploy site" workflow.
#
# Optional repository secret ANTHROPIC_API_KEY: lets the script write the
# one-line news highlight with Claude; without it the abstract's first
# sentence is used.

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "_data/arxiv.yml"
      - "_bibliography/manual.bib"
      - "bin/update_arxiv.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-arxiv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml cairosvg

      - name: Regenerate papers.bib, news items and thumbnails from arXiv
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 bin/update_arxiv.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib _news assets/img/publication_preview
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: update publications from arXiv"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updated:" >> "$GITHUB_STEP_SUMMARY"
            git show --stat --oneline HEAD | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          fi

      # Commits made with GITHUB_TOKEN do not trigger other workflows on their
      # own, so start the deploy explicitly.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
